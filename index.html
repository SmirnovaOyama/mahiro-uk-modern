<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <title>Smirnova Anya</title>
        <meta name="description" content="Smirnova Anya builds quiet, deliberate software in the open." />
        <meta name="color-scheme" content="light dark" />

        <!-- What a shared link shows. The picture is public/og.png, made by `npm run og`. -->
        <link rel="canonical" href="https://mahiro.uk/" />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://mahiro.uk/" />
        <meta property="og:site_name" content="mahiro.uk" />
        <meta property="og:title" content="Smirnova Anya" />
        <meta property="og:description" content="Smirnova Anya builds quiet, deliberate software in the open." />
        <meta property="og:image" content="https://mahiro.uk/og.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:alt" content="Hello, and welcome. I’m Anya. I build quiet software. I am unreservedly devoted to a certain anime girl, and I read every letter." />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Smirnova Anya" />
        <meta name="twitter:description" content="Smirnova Anya builds quiet, deliberate software in the open." />
        <meta name="twitter:image" content="https://mahiro.uk/og.png" />
        <link rel="icon" href="/favicon.png" type="image/png" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <script>
            // Before the first paint, so a saved theme never flashes the other one.
            try {
                var theme = localStorage.getItem('site-theme');
                if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
            } catch (e) {}
        </script>
        <script type="module" src="/src/main.ts"></script>
    </head>
    <body>
        <header class="top">
            <a class="btn-ghost btn-icon" id="gh" rel="me noopener" aria-label="GitHub"></a>
            <button class="btn-ghost btn-icon" id="theme" type="button"></button>
        </header>

        <main>
            <h1 class="sr-only">Smirnova Anya</h1>
            <p class="text" id="text" aria-live="polite" tabindex="-1"></p>
        </main>

        <div class="controls">
            <p class="hint"><span class="hint-icon" id="hint-icon"></span><span id="hint"></span></p>
        </div>

        <div class="leave" id="leave" role="dialog" aria-labelledby="leave-text" hidden>
            <p id="leave-text"></p>
            <div class="leave-actions">
                <a class="btn-tonal" id="leave-go" target="_blank" rel="noopener"></a>
                <button class="btn-ghost" id="leave-stay" type="button"></button>
            </div>
        </div>
    </body>
</html>
